name: Build and Deploy

# 推送 custom 即自动：编前端 → 构建 amd64 镜像 → 推到 GHCR → SSH 到 bbpad 服务器只 pull/up memos 服务。
# memos 跑在 bbpad 的 docker-compose 里（见 bbpad-frontend 仓库的 docker-compose.prod.yml），
# 本 CI 只动 memos 这一个服务，不碰 app/backend/mysql/redis。
# 需要 memos 仓库配 DEPLOY_HOST/PORT/USER/SSH_KEY/PATH（指向 bbpad 同一台服务器、/opt/bbpad-blog 目录）。
# main 保持为 memos 官方镜像（干净），custom 是累积定制的部署分支。
on:
  push:
    branches: [custom]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.repository }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write # 推送到 GHCR 所需

env:
  # GHCR 要求镜像名全小写。你的 GitHub 登录是 IhaveBB（含大写），GHCR 包名用小写 ihavebb。
  # 若改了用户名，这里和 scripts/compose.yaml 一起改。
  IMAGE: ghcr.io/ihavebb/memos

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment: 阿里云部署   # 沿用你配了 DEPLOY_* secrets 的环境，否则环境密钥读不到
    steps:
      - uses: actions/checkout@v6

      # ---- 1. 编前端：产物落到 server/router/frontend/dist（Dockerfile 会 embed）----
      - uses: pnpm/action-setup@v4.2.0
        with:
          version: 11.0.1
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: web
      - run: pnpm release
        working-directory: web

      # ---- 2. 登录 GHCR（用自带 GITHUB_TOKEN，无需额外 secret）----
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      # ---- 3. 生成镜像标签：latest + sha-xxxxxx ----
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-,format=short

      # ---- 4. 构建 amd64 镜像并推送 ----
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ./scripts/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ github.ref_name }}
            COMMIT=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ---- 5. 检查部署 secrets 是否齐全（不齐全则跳过部署，镜像照常构建推送）----
      - name: Check deploy secrets
        id: deploy-config
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          if [ -n "$DEPLOY_HOST" ] && [ -n "$DEPLOY_USER" ] && [ -n "$DEPLOY_SSH_KEY" ] && [ -n "$DEPLOY_PATH" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "Deploy secrets are incomplete, skip server deploy."
          fi

      # ---- 6. SSH 到 bbpad 服务器：拉新 memos 镜像 + 重启 memos 服务（只动 memos）----
      - name: Deploy memos to server
        if: steps.deploy-config.outputs.enabled == 'true'
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script_stop: true
          script: |
            cd "${{ secrets.DEPLOY_PATH }}"
            docker compose -f docker-compose.prod.yml pull memos
            docker compose -f docker-compose.prod.yml up -d memos
            docker image prune -f
